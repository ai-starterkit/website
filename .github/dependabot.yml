# Proposes updates to the pinned GitHub Actions and Ruby gems once a month, as pull requests that
# go through the usual checks and review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
