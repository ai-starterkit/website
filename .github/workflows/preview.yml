# A preview link for every pull request, at <site>/pr-preview/pr-<number>/. The link is posted as
# a comment on the pull request within a few minutes and removed when the pull request closes.
# Previews tell search engines not to index them.
#
# Uses rossjrw/pr-preview-action, pinned to a reviewed release. Previews are a convenience:
# if this workflow fails, checks and publishing carry on without it.
name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  pages: read

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Only in the AXIM repository, and not for pull requests from forks (they cannot write previews).
    if: github.repository_owner == 'ai-starterkit' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      JEKYLL_ENV: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ruby/setup-ruby@a5612086821ed5ff914a94f49c9e4e6ee039fb72 # v1.337.0
        if: github.event.action != 'closed'
        with:
          bundler-cache: true

      - name: Work out the site's base address
        id: base
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || echo "")
          base=$(printf '%s' "$url" | sed -E 's#^https?://[^/]+##; s#/$##')
          echo "path=${base}/pr-preview/pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Build the preview
        if: github.event.action != 'closed'
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_config.preview.yml --baseurl "${{ steps.base.outputs.path }}"

      - name: Publish or remove the preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
